version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  
      - "15672:15672" 
    networks:
      - micro-net

  service-a:
    build: .
    command: uvicorn service_a:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000" 
    networks:
      - micro-net

  service-b:
    build: .
    command: uvicorn service_b:app --host 0.0.0.0 --port 8000
    environment:
      - RABBIT_HOST=rabbitmq
    ports:
      - "8002:8000" 
    depends_on:
      - rabbitmq
    networks:
      - micro-net

  worker:
    build: .
    command: python worker.py
    environment:
      - RABBIT_HOST=rabbitmq
      - SERVICE_A_URL=http://service-a:8000/results
    depends_on:
      - rabbitmq
      - service-a
    deploy:
      replicas: 2 
    networks:
      - micro-net

networks:
  micro-net: